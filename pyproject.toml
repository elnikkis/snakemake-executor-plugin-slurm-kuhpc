[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snakemake-executor-plugin-slurm-kuhpc"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Shiori Hironaka", email = "noahluces@gmail.com" },
]
dependencies = [
    "snakemake-interface-common>=1.17.2,<2",
    "snakemake-interface-executor-plugins>=9.2.0,<10",
    "snakemake-executor-plugin-slurm-jobstep>=0.2.1,<1",
]

[project.urls]
Repository = "https://github.com/your/plugin"
Documentation = "https://snakemake.github.io/snakemake-plugin-catalog/plugins/executor/slurm-kuhpc.html"

[dependency-groups]
dev = [
    "black>=24.4.2",
    "flake8>=7.1.0",
    "coverage>=7.5.4",
    "pytest>=8.2.2",
    "snakemake>=9.0",
]
